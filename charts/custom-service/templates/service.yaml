{{- $chart := .Chart -}}
{{- $release := .Release }}
{{- range .Values.deployments }}
{{- $deployment := . }}
{{- range .containers }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $deployment.name }}-{{ .name }}"
  labels:
    app.kubernetes.io/version: {{ $chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ $release.Service }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .serviceType }}
  ports:
  {{- range .endpoints }}
    - port: {{ .servicePort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
      name: {{ .name }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $deployment.name }}
    app.kubernetes.io/instance: {{ $release.Name }}
{{- end }}
{{- end }}